name: ${COMPOSE_PROJECT_NAME:-aas-vpn}

services:
  storage-init:
    build:
      context: .
      dockerfile: portal/Dockerfile
    image: aas-vpn-portal:local
    user: "0:0"
    network_mode: none
    command: [python, init_storage.py]
    volumes:
      - ru_configs:/ru-configs
      - portal_data:/data
      - router_state:/router-state
      - routing_status:/routing-status
      - auth_data:/auth
      - awg_data:/awg-data
      - awg_control:/awg-control
      - awg_network:/awg-network
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    restart: "no"

  awg2:
    image: aas-vpn-awg:3.0.20260805
    build:
      context: .
      dockerfile: awg/Dockerfile
    container_name: awg2
    depends_on:
      storage-init:
        condition: service_completed_successfully
    volumes:
      - awg_data:/awg-data
      - awg_control:/awg-control
      - awg_network:/awg-network
      - /lib/modules:/lib/modules:ro
      - routing_status:/routing-status:ro
    ports:
      - "${AWG_PORT:-443}:1234/udp"
      - "${AWG_FALLBACK_PORT:-1234}:1234/udp"
    networks:
      vpn:
        ipv4_address: 10.42.42.45
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time; s=json.load(open('/awg-control/status.json')); assert s['state']=='applied' and time.time()-s['updated_at']<15"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  adguard-home:
    image: adguard/adguardhome:latest
    container_name: adguard-home
    volumes:
      - adguard_work:/opt/adguardhome/work
      - ./config/adguard:/opt/adguardhome/conf
    ports:
      - "${ADGUARD_SETUP_PUBLISH:-127.0.0.1:3000:3000}"
      - "${ADGUARD_ADMIN_PUBLISH:-127.0.0.1:3001:80}"
    networks:
      vpn:
        ipv4_address: 10.42.42.44
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  sing-box:
    image: aas-vpn-router:1.13.15
    build:
      context: .
      dockerfile: router/Dockerfile
    container_name: sing-box
    stop_grace_period: 30s
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      VPN_CLIENT_CIDR: ${VPN_CLIENT_CIDR:-}
      VPN_DOCKER_CIDR: ${VPN_DOCKER_CIDR:-10.42.42.0/24}
      AWG_CONTAINER_IP: 10.42.42.45
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./config/sing-box.json:/etc/sing-box/config.json:ro
      - portal_data:/data:ro
      - awg_network:/awg-network:ro
      - ru_configs:/ru-configs:ro
      - router_state:/router-state
      - routing_status:/routing-status
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; p=pathlib.Path('/routing-status/status.json'); assert p.exists() and time.time()-p.stat().st_mtime < 45"]
      interval: 5s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    restart: unless-stopped

  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
    image: aas-vpn-portal:local
    depends_on:
      storage-init:
        condition: service_completed_successfully
    container_name: aas-portal
    environment:
      PORTAL_DB: /data/portal.db
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      ZVONOK_PUBLIC_KEY: ${ZVONOK_PUBLIC_KEY}
      ZVONOK_CAMPAIGN_ID: ${ZVONOK_CAMPAIGN_ID}
      ZVONOK_DIAL_NUMBERS: ${ZVONOK_DIAL_NUMBERS}
      ZVONOK_SUCCESS_STATUSES: ${ZVONOK_SUCCESS_STATUSES:-processed,success,confirmed,pincode_ok}
      AUTH_DB: /auth/auth.db
      AUTH_ORIGIN: https://${PORTAL_DOMAIN}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      AWG_SOCKET: /awg-control/control.sock
    volumes:
      - portal_data:/data
      - auth_data:/auth
      - awg_control:/awg-control:ro
      - ru_configs:/ru-configs
      - ./config/sing-box.json:/etc/sing-box/config.json:ro
      - routing_status:/routing-status:ro
    networks:
      vpn:
        ipv4_address: 10.42.42.46
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  migrate-native:
    profiles: [migration]
    image: aas-vpn-portal:local
    user: "0:0"
    command: [python, migrate_native.py]
    network_mode: none
    volumes:
      - awg2_wireguard:/legacy:ro
      - portal_data:/data:ro
      - auth_data:/auth
      - awg_data:/awg-data
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2
    container_name: aas-caddy
    environment:
      VPN_DOMAIN: ${VPN_DOMAIN}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      VPN_SITE_ADDRESS: ${VPN_SITE_ADDRESS:?Set VPN_SITE_ADDRESS}
      PORTAL_SITE_ADDRESS: ${PORTAL_SITE_ADDRESS:?Set PORTAL_SITE_ADDRESS}
    ports:
      - "${CADDY_HTTP_PUBLISH:-80:80}"
      - "${CADDY_HTTPS_PUBLISH:-443:443}"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - vpn
    depends_on: [awg2, portal]
    restart: unless-stopped

networks:
  vpn:
    name: ${VPN_NETWORK_NAME:-aas-vpn}
    ipam:
      config:
        - subnet: ${VPN_DOCKER_CIDR:-10.42.42.0/24}
          gateway: 10.42.42.1

volumes:
  awg2_wireguard:
    name: ${AWG2_VOLUME_NAME:-aas-vpn_awg2_wireguard}
  adguard_work:
    name: ${ADGUARD_WORK_VOLUME_NAME:-aas-vpn_adguard_work}
  portal_data:
    name: ${PORTAL_DATA_VOLUME_NAME:-aas-vpn_portal_data}
  ru_configs:
  router_state:
  routing_status:
  caddy_data:
  caddy_config:

  auth_data:
  awg_data:
  awg_control:
  awg_network:
