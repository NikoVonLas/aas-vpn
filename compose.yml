name: ${COMPOSE_PROJECT_NAME:-aas-vpn}

services:
  awg2:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: awg2
    environment:
      DISABLE_IPV6: "true"
      EXPERIMENTAL_AWG: "true"
      OVERRIDE_AUTO_AWG: awg
    volumes:
      - awg2_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "${AWG_PORT:-443}:1234/udp"
      - "${AWG_FALLBACK_PORT:-1234}:1234/udp"
    networks:
      vpn:
        ipv4_address: 10.42.42.45
    cap_add: [NET_ADMIN, SYS_MODULE]
    sysctls:
      net.ipv4.ip_forward: "1"
    healthcheck:
      test: ["CMD-SHELL", "awg show | grep -q interface"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  adguard-home:
    image: adguard/adguardhome:latest
    container_name: adguard-home
    volumes:
      - adguard_work:/opt/adguardhome/work
      - ./config/adguard:/opt/adguardhome/conf
    ports:
      - "${ADGUARD_SETUP_PUBLISH:-127.0.0.1:3000:3000}"
      - "${ADGUARD_ADMIN_PUBLISH:-127.0.0.1:3001:80}"
    networks:
      vpn:
        ipv4_address: 10.42.42.44
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  sing-box:
    image: ghcr.io/sagernet/sing-box:v1.13.15
    container_name: sing-box
    command: [run, -c, /etc/sing-box/config.json]
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./config/sing-box.json:/etc/sing-box/config.json:ro
    depends_on:
      awg2:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    restart: unless-stopped

  portal:
    build: ./portal
    container_name: aas-portal
    environment:
      PORTAL_DB: /data/portal.db
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      ZVONOK_PUBLIC_KEY: ${ZVONOK_PUBLIC_KEY}
      ZVONOK_CAMPAIGN_ID: ${ZVONOK_CAMPAIGN_ID}
      ZVONOK_DIAL_NUMBERS: ${ZVONOK_DIAL_NUMBERS}
      ZVONOK_SUCCESS_STATUSES: ${ZVONOK_SUCCESS_STATUSES:-processed,success,confirmed}
      AWG_API_URL: http://awg2:51821
    volumes:
      - portal_data:/data
    networks:
      vpn:
        ipv4_address: 10.42.42.46
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  auth-sync:
    build: ./portal
    container_name: aas-auth-sync
    command: [python, sync.py]
    user: "0:65532"
    network_mode: none
    volumes:
      - portal_data:/data
      - awg2_wireguard:/wg-easy:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: aas-caddy
    environment:
      VPN_DOMAIN: ${VPN_DOMAIN}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      VPN_SITE_ADDRESS: ${VPN_SITE_ADDRESS:?Set VPN_SITE_ADDRESS}
      PORTAL_SITE_ADDRESS: ${PORTAL_SITE_ADDRESS:?Set PORTAL_SITE_ADDRESS}
    ports:
      - "${CADDY_HTTP_PUBLISH:-80:80}"
      - "${CADDY_HTTPS_PUBLISH:-443:443}"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - vpn
    depends_on: [awg2, portal]
    restart: unless-stopped

networks:
  vpn:
    name: ${VPN_NETWORK_NAME:-aas-vpn}

volumes:
  awg2_wireguard:
    name: ${AWG2_VOLUME_NAME:-aas-vpn_awg2_wireguard}
  adguard_work:
    name: ${ADGUARD_WORK_VOLUME_NAME:-aas-vpn_adguard_work}
  portal_data:
    name: ${PORTAL_DATA_VOLUME_NAME:-aas-vpn_portal_data}
  caddy_data:
  caddy_config:
