http:
  address: 0.0.0.0:3000
  session_ttl: 30d
users: []
auth_attempts: 5
block_auth_min: 15
language: ru
theme: auto
dns:
  bind_hosts: [0.0.0.0]
  port: 53
  ratelimit: 0
  refuse_any: true
  upstream_dns:
    - 10.42.42.1:5353
    - 10.42.42.1:5354
    - 10.42.42.1:5355
    - 10.42.42.1:5356
  bootstrap_dns: [1.1.1.1, 9.9.9.9]
  fallback_dns: [1.1.1.1, 9.9.9.9]
  upstream_mode: parallel
  fastest_timeout: 1s
  cache_enabled: true
  cache_size: 16777216
  aaaa_disabled: true
  enable_dnssec: true
  upstream_timeout: 5s
  blocked_hosts: [version.bind, id.server, hostname.bind]
  trusted_proxies: [127.0.0.0/8, "::1/128"]
  serve_plain_dns: true
tls:
  enabled: false
querylog:
  interval: 1d
  size_memory: 1000
  enabled: true
  file_enabled: false
statistics:
  interval: 1d
  enabled: true
filters:
  - {enabled: true, url: "https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt", name: "AdGuard DNS filter", id: 1}
  - {enabled: true, url: "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/tif.mini.txt", name: "HaGeZi TIF Mini", id: 3}
  - {enabled: true, url: "https://raw.githubusercontent.com/Zalexanninev15/NoADS_RU/main/ads_list_extended_plus.txt", name: "NoADS RU", id: 4}
whitelist_filters: []
user_rules: []
filtering:
  blocking_mode: default
  filtering_enabled: true
  rewrites_enabled: true
  protection_enabled: true
  filters_update_interval: 24
  blocked_response_ttl: 10
clients:
  runtime_sources: {whois: true, arp: true, rdns: true, dhcp: true, hosts: true}
  persistent: []
log:
  enabled: true
  file: /opt/adguardhome/work/adguard.log
  max_backups: 2
  max_size: 20
  max_age: 3
  compress: true
schema_version: 34
