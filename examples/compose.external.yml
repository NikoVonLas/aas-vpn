# Example for an existing installation behind an external reverse proxy.
# Copy to compose.local.yml, adjust paths and volume names, then set
# COMPOSE_FILE=compose.yml:compose.local.yml in .env.
services:
  awg2:
    ports: !override
      - "${AWG_PORT:-443}:1234/udp"
  adguard-home:
    volumes:
      - ./data/adguard:/opt/adguardhome/conf
  portal:
    volumes:
      - ./data/sing-box/config.json:/etc/sing-box/config.json:ro
  sing-box:
    volumes:
      - ./data/sing-box/config.json:/etc/sing-box/config.json:ro

networks:
  vpn:
    external: true
    ipam: !reset null

volumes:
  awg2_wireguard:
    external: true
  adguard_work:
    external: true
  portal_data:
    external: true
